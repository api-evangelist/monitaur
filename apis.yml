name: Monitaur
description: >-
  Monitaur is an enterprise AI governance platform that helps regulated
  organizations manage machine learning and AI responsibly across the full model
  lifecycle. Its software lets teams define enterprise-wide AI governance
  policies, manage and monitor model performance for drift and bias, and
  automate model validation, risk assessment, stress testing, and vendor
  governance at scale. Monitaur is built for regulated industries such as
  insurance and financial services, delivering audit-ready documentation and
  compliance reporting. A Techstars-backed company, Monitaur has been recognized
  as a Gartner Magic Quadrant Visionary and is SOC 2 Type II certified. The
  company does not currently publish a public developer API, SDKs, or a developer
  portal; this profile captures its identity and security posture.
